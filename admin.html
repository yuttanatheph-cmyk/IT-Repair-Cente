<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Admin Dashboard - ระบบจัดการงานซ่อม</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        * { font-family: 'Prompt', sans-serif; box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.82)), url('bg.jpg');
            background-size: cover; background-position: center; background-attachment: fixed; min-height: 100vh; color: #2b3445;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
        }
        .navbar-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; color: #0d6efd; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-card {
            background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(10px); border-radius: 12px; padding: 20px;
            display: flex; align-items: center; gap: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.8);
        }
        .stat-icon { width: 55px; height: 55px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .stat-icon.yellow { background: #fef3c7; color: #d97706; }
        .stat-icon.blue { background: #e0f2fe; color: #0284c7; }
        .stat-icon.green { background: #dcfce7; color: #16a34a; }
        .stat-info h3 { font-size: 1.8rem; font-weight: 700; color: #0f172a; }
        .stat-info p { color: #64748b; font-size: 0.9rem; }
        .table-card {
            background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(10px); border-radius: 12px; padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06); border: 1px solid rgba(255,255,255,0.8);
        }
        .table-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .search-box { position: relative; }
        .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .search-box input { padding: 9px 12px 9px 36px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; width: 280px; font-size: 0.9rem; background: white; }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.92rem; }
        th, td { padding: 12px 14px; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #475569; font-weight: 600; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .badge-yellow { background: #fef3c7; color: #b45309; }
        .badge-blue { background: #e0f2fe; color: #0369a1; }
        .badge-green { background: #dcfce7; color: #15803d; }
        .btn-status { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; font-weight: 500; font-size: 0.85rem; cursor: pointer; }
        .btn-status:hover { background: #0d6efd; color: white; border-color: #0d6efd; }
        .btn-logout { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 0.9rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
        .btn-logout:hover { background: #fee2e2; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand"><i class="fa-solid fa-user-shield"></i><span>IT Admin Dashboard - ระบบจัดการงานซ่อม</span></div>
        <a href="home.html" class="btn-logout" onclick="localStorage.removeItem('adminRole')"><i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ</a>
    </nav>

    <div class="container">
        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon yellow"><i class="fa-solid fa-clock"></i></div>
                <div class="stat-info"><h3 id="adminPendingCount">0</h3><p>รอดำเนินการ</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon blue"><i class="fa-solid fa-spinner"></i></div>
                <div class="stat-info"><h3 id="adminProgressCount">0</h3><p>กำลังซ่อมแซม</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="fa-solid fa-circle-check"></i></div>
                <div class="stat-info"><h3 id="adminDoneCount">0</h3><p>ซ่อมเสร็จแล้ว</p></div>
            </div>
        </div>

        <!-- Table Card -->
        <div class="table-card">
            <div class="table-card-header">
                <h3><i class="fa-solid fa-list-check" style="color: #0d6efd;"></i> รายการแจ้งซ่อมทั้งหมด</h3>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="adminSearchInput" placeholder="ค้นหาชื่อ, อุปกรณ์, อาการ..." oninput="filterAdminTable()">
                </div>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>เลขที่แจ้งซ่อม</th>
                            <th>วัน-เวลา</th>
                            <th>ผู้แจ้ง / แผนก</th>
                            <th>อุปกรณ์</th>
                            <th>อาการเสีย</th>
                            <th>สถานะ</th>
                            <th>จัดการสถานะ</th>
                        </tr>
                    <thead id="adminTableBody">
                        <!-- ข้อมูลจะถูกโหลดผ่าน JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadAdminTable();
        });

        function loadAdminTable() {
            const requests = JSON.parse(localStorage.getItem('repairRequests')) || [];
            const tbody = document.getElementById('adminTableBody');
            
            let pending = 0, progress = 0, done = 0;

            if (requests.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#64748b; padding: 30px;">ยังไม่มีรายการแจ้งซ่อมในระบบ</td></tr>`;
            } else {
                tbody.innerHTML = requests.map((item, index) => {
                    if (item.status === 'รอดำเนินการ') pending++;
                    else if (item.status === 'กำลังดำเนินการ') progress++;
                    else if (item.status === 'เสร็จสิ้น') done++;

                    let badgeClass = 'badge-yellow';
                    if (item.status === 'กำลังดำเนินการ') badgeClass = 'badge-blue';
                    if (item.status === 'เสร็จสิ้น') badgeClass = 'badge-green';

                    return `
                        <tr>
                            <td style="font-weight:600; color:#0d6efd;">${item.id}</td>
                            <td style="font-size:0.85rem; color:#64748b;">${item.date}</td>
                            <td><strong>${item.name}</strong><br><span style="font-size:0.8rem; color:#64748b;"><i class="fa-solid fa-building"></i> ${item.department} | TEL: ${item.tel}</span></td>
                            <td><span style="background:#f1f5f9; padding:2px 8px; border-radius:4px; font-size:0.85rem;">${item.device}</span></td>
                            <td>${item.issue}</td>
                            <td><span class="badge ${badgeClass}">${item.status}</span></td>
                            <td>
                                <select class="btn-status" onchange="updateStatus(${index}, this.value)">
                                    <option value="รอดำเนินการ" ${item.status==='รอดำเนินการ'?'selected':''}>รอดำเนินการ</option>
                                    <option value="กำลังดำเนินการ" ${item.status==='กำลังดำเนินการ'?'selected':''}>กำลังดำเนินการ</option>
                                    <option value="เสร็จสิ้น" ${item.status==='เสร็จสิ้น'?'selected':''}>เสร็จสิ้น</option>
                                </select>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            document.getElementById('adminPendingCount').textContent = pending;
            document.getElementById('adminProgressCount').textContent = progress;
            document.getElementById('adminDoneCount').textContent = done;
        }

        function updateStatus(index, newStatus) {
            const requests = JSON.parse(localStorage.getItem('repairRequests')) || [];
            requests[index].status = newStatus;
            localStorage.setItem('repairRequests', JSON.stringify(requests));
            loadAdminTable();
        }

        function filterAdminTable() {
            const keyword = document.getElementById('adminSearchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#adminTableBody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(keyword) ? '' : 'none';
            });
        }
    </script>
</body>
</html>
